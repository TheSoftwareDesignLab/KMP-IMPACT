name: Feature request
description: Suggest a capability or improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Which review or maintenance pain are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How should the analyzer behave? CLI flag, new contract field, additional report tab, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read the limitations in `docs/troubleshooting.md`.
          required: true
